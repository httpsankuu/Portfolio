<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0B1F"/>
      <stop offset="100%" stop-color="#16122A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="900" cy="315" r="380" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#252540" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(80, 90)">
    <rect width="60" height="60" rx="14" fill="url(#accent)"/>
    <text x="30" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700" fill="#0F0B1F" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <text x="160" y="135" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="#E8E8F0">Ankit Kumar Singh</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="800" fill="#E8E8F0">Machine Learning</text>
  <text x="80" y="400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="800" fill="url(#accent)">Engineer</text>

  <!-- Subhead -->
  <text x="80" y="470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="500" fill="#7B7B9A">Building AI that solves real problems.</text>

  <!-- Footer pill -->
  <g transform="translate(80, 530)">
    <rect width="290" height="52" rx="26" fill="#16122A" stroke="#6C63FF" stroke-width="2"/>
    <text x="145" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#6C63FF" text-anchor="middle">portfolio-engineerhihu.vercel.app</text>
  </g>
</svg>
